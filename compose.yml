services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: db_cms
    platform: linux/amd64
    volumes:
      - ./data/database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
    ports:
      - 5433:${POSTGRES_PORT} # External:Internal
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--host=localhost",
          "--username=${POSTGRES_USER}",
          "--dbname=${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
      - frontend
      - shared

  cache:
    image: redis:6
    container_name: cache
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  # Directus service with custom extensions
  directus:
    image: ${DOCKER_USERNAME}/lmu-app-cms:${ENVIRONMENT:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${ENVIRONMENT:-production}
        BUILD_DATE: ${BUILD_DATE:-local}
    container_name: directus_${ENVIRONMENT:-dev}
    ports:
      - 8055:8055
    volumes:
      - ./uploads:/directus/uploads
      - ./data/directus:/directus/data
    environment:
      # Database Config
      DB_CLIENT: "pg"
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Directus Config
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}

      # SMTP Config
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE}
      EMAIL_SMTP_IGNORE_TLS: ${EMAIL_SMTP_IGNORE_TLS}
      EMAIL_SMTP_NAME: ${EMAIL_SMTP_NAME}
      EMAIL_SMTP_POOL: ${EMAIL_SMTP_POOL}

      # Features
      WEBSOCKETS_ENABLED: "true"
      GRAPHQL_INTROSPECTION: "true"

      # Cache Config
      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"

      # Set environment
      NODE_ENV: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - frontend
      - shared

networks:
  backend:
  frontend:
  shared:
    external: true
